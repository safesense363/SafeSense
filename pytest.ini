[pytest]
# Only collect tests from the dedicated tests/ directory.
# Root-level test_*.py files are manual live-camera integration scripts
# that require a physical camera and a running model — not unit tests.
testpaths = tests

# Show extra summary info for failures, errors, and skips
addopts = -v --tb=short

# Treat these warnings as non-fatal
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*

